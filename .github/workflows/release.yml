name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g: 0.2.0~test)"
        default: "0.0.0~dev"

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

env:
  RAW_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: deb-x86_64,  image: "ghcr.io/gibus21250/wakupator-build:debian12", gen: DEB, arch: x86_64, toolchain: "" }
          - { name: deb-aarch64, image: "ghcr.io/gibus21250/wakupator-build:debian12", gen: DEB, arch: aarch64, toolchain: "cmake/toolchains/aarch64-linux-gnu.cmake" }
          - { name: rpm-x86_64,  image: "ghcr.io/gibus21250/wakupator-build:alma9", gen: RPM, arch: x86_64, toolchain: "" }
          - { name: tgz-x86_64,  image: "ghcr.io/gibus21250/wakupator-build:alma9", gen: TGZ, arch: x86_64, toolchain: "" }
          - { name: tgz-aarch64, image: "ghcr.io/gibus21250/wakupator-build:debian12", gen: TGZ, arch: aarch64, toolchain: "cmake/toolchains/aarch64-linux-gnu.cmake" }

    name: package-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        run: |
          VERSION="${RAW_VERSION#v}"
          VERSION="${VERSION//-/\~}"
          echo "Building version: ${VERSION}"

          ARGS=()
          if [ -n "${{ matrix.toolchain }}" ]; then
            ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$PWD/${{ matrix.toolchain }}" -DWAKUPATOR_UNIT_ONLY=ON)
          fi
          if [ "${{ matrix.gen }}" = "DEB" ] && [ "${{ matrix.arch }}" = "aarch64" ]; then
            ARGS+=(-DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
                   -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=OFF
                   -DCPACK_DEBIAN_PACKAGE_DEPENDS=libc6)
          fi
          if [ "${{ matrix.gen }}" = "TGZ" ]; then
            ARGS+=("-DCPACK_SYSTEM_NAME=linux-${{ matrix.arch }}")
          fi

          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
                -DWAKUPATOR_VERSION="${VERSION}" "${ARGS[@]}"
          cmake --build build -j"$(nproc)"
          cd build
          cpack -G ${{ matrix.gen }}

          mkdir -p "$GITHUB_WORKSPACE/dist"
          find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) \
               -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: dist/*

  openwrt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: mipsel_24kc, sdk: "25.12.0" }
          - { arch: mipsel_24kc, sdk: "24.10.0" }
          - { arch: aarch64_cortex-a53, sdk: "25.12.0" }
          - { arch: aarch64_cortex-a53, sdk: "24.10.0" }
          - { arch: x86_64, sdk: "25.12.0" }
          - { arch: x86_64, sdk: "24.10.0" }
          - { arch: mips_24kc, sdk: "25.12.0" }
          - { arch: mips_24kc, sdk: "24.10.0" }
    name: openwrt-${{ matrix.arch }}-${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v6

      - name: Build with OpenWrt SDK
        run: |
          V="${RAW_VERSION#v}"
          V="${V%%[~-]*}"

          CID=$(docker create \
            -e WAKUPATOR_VERSION="$V" \
            -e WAKUPATOR_SRC=/repo \
            --entrypoint bash -w /builder \
            ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }} \
            -c '
            set -e
            cp -r /repo/packaging/openwrt/wakupator package/wakupator
            make defconfig
            make package/wakupator/compile V=s -j"$(nproc)"
            ')
          echo "CID=$CID" >> "$GITHUB_ENV"
          docker cp . "$CID:/repo"
          docker start -a "$CID"
          docker cp "$CID:/builder/bin" ./sdk-bin
          docker rm "$CID"

      - name: Collect
        run: |
          mkdir -p dist
          find sdk-bin -type f \( -name '*wakupator*.apk' -o -name '*wakupator*.ipk' \) \
            | while read -r f; do
                cp "$f" "dist/openwrt-${{ matrix.sdk }}-${{ matrix.arch }}-$(basename "$f")"
              done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-openwrt-${{ matrix.arch }}-${{ matrix.sdk }}
          path: dist/*

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$CID" 2>/dev/null || true
          docker rmi -f ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.sdk }} 2>/dev/null || true

  release:
    needs: [package, openwrt]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: Install git-cliff
        run: |
          python3 -m venv /tmp/cliff-venv
          /tmp/cliff-venv/bin/pip install git-cliff==2.14.2
          echo "/tmp/cliff-venv/bin" >> "$GITHUB_PATH"

      - name: Draft release notes
        run: |
          {
          echo "## Resume"
          echo
          echo "<!-- FILL -->"
          echo
          echo "## Changelog"
          git cliff --latest --strip header
          echo
          } > notes.md

      - name: Create draft release (Gitea)
        if: github.server_url != 'https://github.com'
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          BODY=$(jq -n --arg tag "${{ github.ref_name }}" --rawfile notes notes.md \
            '{tag_name:$tag, name:$tag, body:$notes, draft:true}')
          ID=$(curl -fsS -X POST "$API/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" | jq -r .id)
          for f in dist/*; do
            curl -fsS -X POST "$API/releases/$ID/assets?name=$(basename "$f")" \
              -H "Authorization: token $TOKEN" -F "attachment=@$f"
          done

      - name: Create draft release (GitHub)
        if: github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --draft --title "${{ github.ref_name }}" \
            --notes-file notes.md dist/*