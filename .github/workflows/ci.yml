name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Title format verification
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          REG='^(feat|fix|perf|refactor|docs|test|build|ci|chore)(\([a-z0-9_-]+\))?!?: [^ ].+$'
          echo "$TITLE" | grep -Eq "$REG" \
            || { echo "Invalid title: $TITLE (e.g: feat(core): my new feature)"; exit 1; }

  build:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gibus21250/wakupator-build:debian12
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64,  toolchain: "" }
          - { name: aarch64, toolchain: "cmake/toolchains/aarch64-linux-gnu.cmake" }

    name: build-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: |
          ARGS=()
          if [ -n "${{ matrix.toolchain }}" ]; then
            ARGS+=("-DCMAKE_TOOLCHAIN_FILE=$PWD/${{ matrix.toolchain }}")
            ARGS+=("-DWAKUPATOR_UNIT_ONLY=ON")
          fi
          cmake -B build-${{ matrix.name }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DWAKUPATOR_BUILD_TESTS=ON \
            "${ARGS[@]}"

      - name: Build
        run: cmake --build build-${{ matrix.name }} -j"$(nproc)"

      - name: Tests
        run: ctest --test-dir build-${{ matrix.name }} --output-on-failure --parallel

      - name: Binary archive
        uses: actions/upload-artifact@v4
        with:
          name: wakupator-${{ matrix.name }}
          path: build-${{ matrix.name }}/wakupator